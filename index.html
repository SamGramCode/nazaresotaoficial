<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazaresota Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        .font-serif-custom { font-family: 'Playfair Display', serif; }
        .font-sans-custom { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 min-h-screen flex items-center justify-center p-4 font-sans-custom">

    <div class="w-full max-w-sm bg-gradient-to-b from-[#D8CEE3] to-[#C8B8D8] rounded-[2.5rem] p-6 shadow-2xl flex flex-col items-center text-center relative overflow-hidden border border-[#d4c4e0]">
        
        <!-- Imagen de Perfil -->
        <div class="mt-4 mb-6 w-full h-64 rounded-2xl overflow-hidden shadow-lg border-2 border-white/30">
            <img src="nazaresota.png" 
                 alt="Nazaresota" 
                 class="w-full h-full object-cover">
        </div>

        <!-- Título -->
        <h1 class="font-serif-custom text-4xl text-[#6B5B7F] font-normal tracking-wide uppercase mb-4">
            Nazaresota<br><span class="text-3xl">Oficial</span>
        </h1>

        <!-- Descripción -->
        <p class="text-[#7A6A8F] text-sm leading-relaxed px-3 mb-10 font-light">
            Un espacio íntimo con gracie. Donde comparto mi behind-the-scenes y autenticidad sin filtros.
        </p>

        <!-- Sección de Autenticación -->
        <div class="mt-auto w-full flex flex-col items-center pb-6">
            <!-- Icono Huella Digital -->
            <div class="text-[#9088A8] mb-4 opacity-80">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.81 3.7"></path>
                    <path d="M12 2a10 10 0 0 0-7.35 16.76"></path>
                    <path d="M16 16v1a2 2 0 0 1-4 0v-2a4 4 0 0 0-8 0v1"></path>
                    <path d="M12 6a6 6 0 0 0-6 6c0 1.5.2 3.5 1 5"></path>
                    <path d="M19 11v2a7 7 0 0 1-1.4 4.2"></path>
                    <path d="M20.24 7.24A10 10 0 0 1 22 12v1"></path>
                </svg>
            </div>
            
            <!-- Texto -->
            <span class="text-xs uppercase tracking-widest text-[#8A7AA0] font-medium">
                Mantén presionado para autenticar
            </span>
        </div>

    </div>

</body>
</html>

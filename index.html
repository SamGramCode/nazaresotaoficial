<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inner Circle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    @media (max-width: 480px) {
      body {
        padding: 0.5rem;
      }

      .card img {
        border-radius: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <img src="nazaresota.png" alt="Inner Circle" loading="lazy">
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fashion, lifestyle, self-love and authentic connection">
    <title>Hi Nazaresota | Official</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow-x: hidden; background: transparent; }
        body { position: relative; }

        @media (max-width: 768px) {
            body { height: 100vh; overflow-y: hidden; }
        }

        @media (min-width: 769px) {
            body { overflow-y: auto; }
        }

        #root {
            width: 100%;
            height: 100%;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scale(1.1);
            display: block;
        }

        .text-overlay {
            position: absolute;
            bottom: 5px;
            left: 50px;
            right: 50px;
            color: #FFFFFF;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            line-height: 1.6;
            font-size: 0.75rem;
            z-index: 10;
            text-transform: uppercase;
            text-align: center;
        }

        .text-overlay h1 {
            font-size: 2.4rem;
            margin-bottom: 1rem;
            font-family: 'Bebas Neue', sans-serif;
            position: relative;
            top: 60px;
        }

        .text-overlay h1 .hola {
            font-size: 4.8rem;
            position: relative;
            bottom: -50px;
            font-family: 'Poppins', sans-serif;
            letter-spacing: -0.1em;
        }

        .text-overlay h1 .cielo {
            display: block;
            position: relative;
            left: 12px;
        }

        .text-overlay p { margin-bottom: 1rem; position: relative; top: 38px; }

        .lock-btn {
            font-size: 0.9rem;
            margin-top: 2rem;
            padding: 1rem 2rem;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            top: 10px;
            background: rgba(255,255,255,0.05);
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
            transition: all 0.3s;
            font-weight: 700;
            color: #FFFFFF;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            display: block;
            width: auto;
            min-width: 200px;
            margin-left: auto;
            margin-right: auto;
            touch-action: manipulation;
        }

        .lock-icon { opacity: 0.4; }

        .lock-subtitle {
            font-size: 0.65rem;
            margin-top: 1.5rem;
            opacity: 0.6;
            position: relative;
            top: -10px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('fondo-mariposas.jpg') center/cover no-repeat;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            overflow-y: hidden;
        }

        .modal.show {
            display: flex;
        }

        .modal-card {
            background: rgba(180,160,205,0.95);
            border-radius: 25px;
            padding: 3rem 2rem;
            text-align: center;
            max-width: 320px;
        }

        .age-badge {
            width: 90px;
            height: 90px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: #FFFFFF;
        }

        .modal-title {
            color: #FFFFFF;
            font-size: 1.3rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 1rem 0;
        }

        .modal-text {
            color: #FFFFFF;
            font-size: 0.95rem;
            margin: 1.5rem 0 2rem 0;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn-yes, .btn-no {
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .btn-yes {
            background: #FF6B9D;
            color: #FFFFFF;
        }

        .btn-yes:hover { background: #FF5585; transform: translateY(-2px); }

        .btn-no {
            background: #9B9B9B;
            color: #FFFFFF;
        }

        .btn-no:hover { background: #808080; transform: translateY(-2px); }

        .links-section {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('fondo-mariposas.jpg') center/cover no-repeat;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
        }

        .links-section.show {
            display: flex;
        }

        .btn-link {
            width: 100%;
            max-width: 300px;
            padding: 1.5rem;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            background: #FF6B9D;
            color: #FFFFFF;
        }

        .btn-link:hover { background: #FF5585; transform: scale(1.05); }

        .language-selector {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 10000;
            display: flex;
            gap: 12px;
        }

        .lang-btn {
            background: none;
            border: none;
            color: #FFFFFF;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            padding: 5px;
            text-decoration: none;
            transition: all 0.3s;
            letter-spacing: 1px;
            user-select: none;
        }

        .lang-btn.active { text-decoration: underline; }

        @media (min-width: 769px) {
            .text-overlay h1 { font-size: 4rem; top: 205px; }
            .text-overlay h1 .hola { font-size: 8rem; }
            .text-overlay p { top: 263px; }
            .lock-btn { font-size: 1.1rem; padding: 1.2rem 2.5rem; top: 335px; }
            .lock-subtitle { font-size: 0.8rem; top: 315px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const PRESS_TIME = 1200;
        let isActivated = false;
        let pressTimer = null;
        let lockBtn = null;

        const translations = {
            es: {
                hola: 'Hola',
                cielo: 'mi CIELO ♡',
                para1: 'Hola, soy NAZARESOTA ♡ auténtica y con mucho encanto. Me encanta disfrutar de la vida, reírme de todo y conectar con personas que sepan apreciar una mujer segura de sí misma. ♡',
                para2: 'Soy una mezcla de dulzura, actitud y curvas que no pasan desapercibidas. Me gustan las buenas conversaciones, los detalles inesperados y las conexiones que se sienten especiales. ♡',
                para3: 'Si te gustan las mujeres con personalidad, seguridad y una sonrisa que enamora, quizás aquí encuentres algo más que una simple bio. ♡',
                lockBtn: 'MANTÉN PRESIONADO AQUÍ 🔒',
                lockSubtitle: 'Mantén presionado para entrar sin candado',
                lockBtnActive: 'TOCA AQUÍ PARA VER MÁS 🔒',
                modalTitle: 'VERIFICACIÓN DE EDAD',
                modalText: 'Este contenido está restringido para mayores de 18 años',
                btnYes: 'SÍ TENGO 18+',
                btnNo: 'NO, VOLVER',
            },
            en: {
                hola: 'Hello',
                cielo: 'my HEAVEN ♡',
                para1: 'Hi, I\'m NAZARESOTA ♡ authentic and charming. I love enjoying life, laughing at everything and connecting with people who know how to appreciate a confident woman. ♡',
                para2: 'I\'m a mix of sweetness, attitude and curves that don\'t go unnoticed. I like good conversations, unexpected details and connections that feel special. ♡',
                para3: 'If you like women with personality, confidence and a smile that captivates, maybe here you\'ll find something more than just a simple bio. ♡',
                lockBtn: 'HOLD HERE 🔒',
                lockSubtitle: 'Hold to enter unlocked',
                lockBtnActive: 'TAP HERE FOR MORE 🔒',
                modalTitle: 'AGE VERIFICATION',
                modalText: 'This content is restricted for 18+ only',
                btnYes: 'YES I\'M 18+',
                btnNo: 'NO, GO BACK',
            }
        };

        let currentLang = localStorage.getItem('language') || 'es';

        function renderLevel1() {
            const t = translations[currentLang];
            return `
                <div class="language-selector">
                    <button type="button" class="lang-btn ${currentLang === 'es' ? 'active' : ''}" data-lang="es">ES</button>
                    <button type="button" class="lang-btn ${currentLang === 'en' ? 'active' : ''}" data-lang="en">EN</button>
                </div>
                <div class="container">
                    <img src="nazaresota.png" alt="Nazaresota">
                    <div class="text-overlay">
                        <h1><span class="hola">${t.hola}</span><br><span class="cielo">${t.cielo}</span></h1>
                        <p>${t.para1}</p>
                        <p>${t.para2}</p>
                        <p>${t.para3}</p>
                        <button type="button" class="lock-btn" id="lockBtn">${t.lockBtn}</button>
                        <div class="lock-subtitle">${t.lockSubtitle}</div>
                    </div>
                </div>
            `;
        }

        function renderAgeModal() {
            const t = translations[currentLang];
            return `
                <div class="modal show" id="ageModal">
                    <div class="modal-card">
                        <div class="age-badge">18+</div>
                        <h2 class="modal-title">${t.modalTitle}</h2>
                        <p class="modal-text">${t.modalText}</p>
                        <div class="modal-buttons">
                            <button type="button" class="btn-yes" id="confirmAgeBtn">${t.btnYes}</button>
                            <button type="button" class="btn-no" id="cancelAgeBtn">${t.btnNo}</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderFinalButtons() {
            return `
                <div class="links-section show">
                    <button type="button" class="btn-link" onclick="window.open('https://onlyfans.com/youtovar', '_blank')">OnlyFans</button>
                    <button type="button" class="btn-link" onclick="window.open('https://t.me/nazaresotass', '_blank')">Telegram</button>
                </div>
            `;
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('language', lang);
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });
        }

        function onPressStart(e) {
            e.preventDefault();
            e.stopPropagation();
            if (isActivated || pressTimer) return;

            let startTime = Date.now();
            const interval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const progress = elapsed / PRESS_TIME;
                if (progress <= 1) {
                    const bgOpacity = 0.05 + (progress * 0.1);
                    lockBtn.style.background = `rgba(255,255,255,${bgOpacity})`;
                } else {
                    clearInterval(interval);
                }
            }, 10);

            pressTimer = setTimeout(() => {
                clearInterval(interval);
                activateButton();
            }, PRESS_TIME);
        }

        function onPressEnd() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
                lockBtn.style.background = 'rgba(255,255,255,0.05)';
            }
        }

        function activateButton() {
            isActivated = true;
            pressTimer = null;
            const t = translations[currentLang];
            lockBtn.textContent = t.lockBtnActive + ' ';
            const icon = document.createElement('span');
            icon.className = 'lock-icon';
            icon.textContent = '🔒';
            lockBtn.appendChild(icon);
            lockBtn.onclick = showAgeModal;
            if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
        }

        function showAgeModal() {
            document.getElementById('root').insertAdjacentHTML('beforeend', renderAgeModal());
            document.getElementById('confirmAgeBtn').onclick = confirmAge;
            document.getElementById('cancelAgeBtn').onclick = cancelAge;
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function confirmAge() {
            document.getElementById('ageModal').remove();
            document.getElementById('root').insertAdjacentHTML('beforeend', renderFinalButtons());
        }

        function cancelAge() {
            document.getElementById('ageModal').remove();
            resetButton();
        }

        function resetButton() {
            isActivated = false;
            pressTimer = null;
            const t = translations[currentLang];
            lockBtn.textContent = t.lockBtn + ' ';
            const icon = document.createElement('span');
            icon.className = 'lock-icon';
            icon.textContent = '🔒';
            lockBtn.appendChild(icon);
            lockBtn.onclick = null;
            setupLockButton();
        }

        function setupLockButton() {
            lockBtn = document.getElementById('lockBtn');
            if (lockBtn) {
                lockBtn.removeEventListener('pointerdown', onPressStart);
                lockBtn.removeEventListener('pointerup', onPressEnd);
                lockBtn.removeEventListener('pointerleave', onPressEnd);
                lockBtn.removeEventListener('touchstart', onPressStart);
                lockBtn.removeEventListener('touchend', onPressEnd);
                lockBtn.removeEventListener('mousedown', onPressStart);
                lockBtn.removeEventListener('mouseup', onPressEnd);
                lockBtn.removeEventListener('mouseleave', onPressEnd);

                lockBtn.addEventListener('pointerdown', onPressStart);
                lockBtn.addEventListener('pointerup', onPressEnd);
                lockBtn.addEventListener('pointerleave', onPressEnd);
                lockBtn.addEventListener('touchstart', onPressStart);
                lockBtn.addEventListener('touchend', onPressEnd);
                lockBtn.addEventListener('mousedown', onPressStart);
                lockBtn.addEventListener('mouseup', onPressEnd);
                lockBtn.addEventListener('mouseleave', onPressEnd);
            }
        }

        // INIT
        document.getElementById('root').innerHTML = renderLevel1();
        setupLockButton();

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.onclick = (e) => {
                e.preventDefault();
                changeLanguage(btn.getAttribute('data-lang'));
            };
        });
    </script>
</body>
</html>

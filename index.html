<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazaresota Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        .font-serif-custom { font-family: 'Playfair Display', serif; }
        .font-sans-custom { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#0b0b0b] min-h-screen flex items-center justify-center p-4 font-sans-custom">

    <div class="w-full max-w-[900px] flex gap-6">
        
        <!-- PANEL EDITOR (izquierda) -->
        <div class="w-1/2 bg-[#1a1a2e] rounded-lg p-6 text-white">
            <h2 class="text-xl font-bold mb-4">📝 EDITOR</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Título:</label>
                    <input type="text" id="titulo" class="w-full bg-[#2a2a3e] border border-[#444] rounded p-3 text-white" placeholder="Escribe el título" value="NAZARESOTA">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Descripción:</label>
                    <textarea id="descripcion" class="w-full bg-[#2a2a3e] border border-[#444] rounded p-3 text-white h-24" placeholder="Escribe la descripción">Un espacio íntimo con gracie. Donde comparto mi behind-the-scenes y autenticidad sin filtros.</textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Texto botón:</label>
                    <input type="text" id="boton" class="w-full bg-[#2a2a3e] border border-[#444] rounded p-3 text-white" placeholder="Escribe el texto del botón" value="Mantén presionado para autenticar">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Color de fondo (hex):</label>
                    <input type="text" id="bgColor" class="w-full bg-[#2a2a3e] border border-[#444] rounded p-3 text-white" placeholder="#D6CCE3" value="#D6CCE3">
                </div>

                <button onclick="limpiar()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                    🗑️ Borrar todo
                </button>
            </div>
        </div>

        <!-- VISTA PREVIA (derecha) -->
        <div class="w-1/2 flex items-center justify-center">
            <div id="preview" class="w-full max-w-[350px] rounded-[2.5rem] pt-12 pb-10 px-6 shadow-2xl flex flex-col items-center text-center relative overflow-hidden border" style="background-color: #D6CCE3; border-color: #c4b7d3;">
                
                <!-- Imagen -->
                <div class="w-full mb-5 flex items-center justify-center relative overflow-hidden shadow-md border-2 border-white/50">
                    <img src="nazaresota.png" alt="Avatar" class="w-full h-auto object-cover">
                </div>

                <!-- Título -->
                <h1 id="previewTitulo" class="font-serif-custom text-[2rem] leading-[1.1] text-[#433550] font-normal tracking-wide uppercase mb-3">
                    NAZARESOTA
                </h1>

                <!-- Descripción -->
                <p id="previewDescripcion" class="text-[#564863] text-[13px] leading-relaxed px-3 mb-14 font-light">
                    Un espacio íntimo con gracie. Donde comparto mi behind-the-scenes y autenticidad sin filtros.
                </p>

                <!-- Botón -->
                <div class="w-full flex flex-col items-center mt-auto">
                    <div class="text-[#625172] mb-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.81 3.7"></path>
                            <path d="M12 2a10 10 0 0 0-7.35 16.76"></path>
                            <path d="M16 16v1a2 2 0 0 1-4 0v-2a4 4 0 0 0-8 0v1"></path>
                            <path d="M12 6a6 6 0 0 0-6 6c0 1.5.2 3.5 1 5"></path>
                            <path d="M19 11v2a7 7 0 0 1-1.4 4.2"></path>
                            <path d="M20.24 7.24A10 10 0 0 1 22 12v1"></path>
                        </svg>
                    </div>
                    <span id="previewBoton" class="text-[10px] uppercase tracking-[0.25em] text-[#6e5d7f] font-medium">
                        Mantén presionado para autenticar
                    </span>
                </div>

            </div>
        </div>

    </div>

    <script>
        // Elementos del editor
        const titulo = document.getElementById('titulo');
        const descripcion = document.getElementById('descripcion');
        const boton = document.getElementById('boton');
        const bgColor = document.getElementById('bgColor');

        // Elementos de preview
        const previewTitulo = document.getElementById('previewTitulo');
        const previewDescripcion = document.getElementById('previewDescripcion');
        const previewBoton = document.getElementById('previewBoton');
        const preview = document.getElementById('preview');

        // Función para actualizar en tiempo real
        function actualizar() {
            previewTitulo.textContent = titulo.value || 'NAZARESOTA';
            previewDescripcion.textContent = descripcion.value || 'Descripción';
            previewBoton.textContent = boton.value || 'Mantén presionado para autenticar';
            preview.style.backgroundColor = bgColor.value || '#D6CCE3';
            
            // Guardar en localStorage
            localStorage.setItem('nazaresota-data', JSON.stringify({
                titulo: titulo.value,
                descripcion: descripcion.value,
                boton: boton.value,
                bgColor: bgColor.value
            }));
        }

        // Event listeners
        titulo.addEventListener('input', actualizar);
        descripcion.addEventListener('input', actualizar);
        boton.addEventListener('input', actualizar);
        bgColor.addEventListener('input', actualizar);

        // Limpiar todo
        function limpiar() {
            if (confirm('¿Borrar todo?')) {
                titulo.value = '';
                descripcion.value = '';
                boton.value = '';
                bgColor.value = '#D6CCE3';
                localStorage.removeItem('nazaresota-data');
                actualizar();
            }
        }

        // Cargar datos guardados
        function cargar() {
            const data = localStorage.getItem('nazaresota-data');
            if (data) {
                const obj = JSON.parse(data);
                titulo.value = obj.titulo || '';
                descripcion.value = obj.descripcion || '';
                boton.value = obj.boton || '';
                bgColor.value = obj.bgColor || '#D6CCE3';
                actualizar();
            }
        }

        // Cargar al inicio
        cargar();
    </script>

</body>
</html>

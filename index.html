<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazaresota Oficial</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        .font-serif-custom { font-family: 'Playfair Display', serif; }
        .font-sans-custom { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#121212] min-h-screen flex items-center justify-center p-4 font-sans-custom">

    <!-- Tarjeta Móvil Principal -->
    <div class="w-full max-w-[340px] bg-[#D6CCE3] rounded-[2rem] pt-10 pb-8 px-6 shadow-2xl flex flex-col items-center text-center relative overflow-hidden">
        
        <!-- Contenedor de la Ilustración Superior -->
        <div class="w-44 h-44 mb-4 flex items-center justify-center relative rounded-full overflow-hidden shadow-md border border-white/30">
            <img src="nazaresota.png" 
                 alt="Nazaresota" 
                 class="w-full h-full object-cover">
        </div>

        <!-- Título Principal -->
        <h1 class="font-serif-custom text-[2rem] leading-tight text-[#473B54] font-normal tracking-wide uppercase mb-4 mt-2">
            Nazaresota<br><span class="text-[1.5rem]">Oficial</span>
        </h1>

        <!-- Descripción -->
        <p class="text-[#594B66] text-[13px] leading-relaxed px-4 mb-16 font-light">
            Un espacio íntimo con gracie. Donde comparto mi behind-the-scenes y autenticidad sin filtros.
        </p>

        <!-- Sección de Autenticación / Huella Digital -->
        <div class="w-full flex flex-col items-center mt-auto">
            <!-- Icono de Huella Digital -->
            <div class="text-[#655575] mb-2.5 opacity-90">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 11v5"></path>
                    <path d="M12 7a4 4 0 0 0-4 4v1"></path>
                    <path d="M16 12v1a4 4 0 0 1-8 0v-1a4 4 0 0 1 8 0z"></path>
                    <path d="M19 10a7 7 0 0 1 1 3.5v1.5"></path>
                    <path d="M4 13.5A8 8 0 0 1 12 3a8 8 0 0 1 8 8"></path>
                    <path d="M2 12a10 10 0 0 1 20 0v2"></path>
                </svg>
            </div>
            
            <!-- Texto Inferior -->
            <span class="text-[10px] uppercase tracking-[0.2em] text-[#716082] font-medium">
                Mantén presionado para autentigar
            </span>
        </div>

    </div>

</body>
</html>
